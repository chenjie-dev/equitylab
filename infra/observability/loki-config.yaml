# Loki 单进程本地配置（Compose）
# 参考：https://grafana.com/docs/loki/latest/configure/examples/configuration-examples/
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 100

schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

ruler:
  alertmanager_url: http://localhost:9093

limits_config:
  # 本地演示：放宽旧样本，避免 Docker 历史日志时间戳被拒（Alloy 已过滤 equitylab）
  reject_old_samples: false
  allow_structured_metadata: true
  volume_enabled: true

analytics:
  reporting_enabled: false
