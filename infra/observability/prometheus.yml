# EquityLab Prometheus scrape 配置（Compose 内网 DNS）
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["gateway:3000"]
        labels:
          service: gateway

  - job_name: market-data
    metrics_path: /metrics
    static_configs:
      - targets: ["market-data:3002"]
        labels:
          service: market-data

  - job_name: research
    metrics_path: /metrics
    static_configs:
      - targets: ["research:8002"]
        labels:
          service: research

  - job_name: orchestrator
    metrics_path: /metrics
    static_configs:
      - targets: ["orchestrator:8001"]
        labels:
          service: orchestrator

  - job_name: collector
    metrics_path: /metrics
    static_configs:
      - targets: ["collector:9101"]
        labels:
          service: collector

  - job_name: history-ingest
    metrics_path: /metrics
    static_configs:
      - targets: ["history-ingest:9102"]
        labels:
          service: history-ingest

  - job_name: adata-ingest
    metrics_path: /metrics
    static_configs:
      - targets: ["adata-ingest:9103"]
        labels:
          service: adata-ingest

  - job_name: akshare-ingest
    metrics_path: /metrics
    static_configs:
      - targets: ["akshare-ingest:9104"]
        labels:
          service: akshare-ingest
