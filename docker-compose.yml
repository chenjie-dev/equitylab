# EquityLab 多服务编排（项目名 equitylab，网络 equitylab-net）
# 文档：docs/2026-10-15-containers.md · docs/2026-10-15-api.md · docs/2026-10-15-architecture.md
# 启动：cp .env.example .env && docker compose up -d --build
name: equitylab

services:
  # --- 基础设施 ---
  postgres:
    image: postgres:16-alpine
    container_name: equitylab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-equitylab}
      POSTGRES_USER: ${POSTGRES_USER:-equitylab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-equitylab}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - equitylab_pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ./infra/postgres/migrations/20261026_market_schema.sql:/docker-entrypoint-initdb.d/02_market_schema.sql:ro
    networks: [equitylab]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: equitylab-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks: [equitylab]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  qdrant:
    image: qdrant/qdrant:v1.13.2
    container_name: equitylab-qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_PORT:-6333}:6333"
    volumes:
      - equitylab_qdrant:/qdrant/storage
    networks: [equitylab]

  # 实时行情库：采集写入本进程，研究层只读 /v1/snapshots
  qdb:
    build:
      context: ../qdb
      dockerfile: Dockerfile
    image: equitylab-qdb:local
    container_name: equitylab-qdb
    restart: unless-stopped
    environment:
      QDB_HTTP_ADDR: "0.0.0.0"
      QDB_HTTP_PORT: "9090"
      QDB_FEED: ${QDB_FEED:-0}
      QDB_FEED_MS: ${QDB_FEED_MS:-1000}
      # 与 collector / research seed 对齐（22）；扩大：.env 设 QDB_FEED_CODES
      QDB_FEED_CODES: ${QDB_FEED_CODES:-600519,000001,300750,601318,000858,002594,600036,601012,688981,510300,830879,835185,000568,600900,601899,300059,002475,600276,000333,601166,600030,002415}
    ports:
      - "${QDB_PORT:-9090}:9090"
    volumes:
      - equitylab_qdb:/var/lib/qdb
    networks: [equitylab]

  # 唯一回源进程：公开行情写入 qdb，其它服务只读 qdb
  collector:
    build:
      context: .
      dockerfile: services/collector/Dockerfile
    image: equitylab-collector:local
    container_name: equitylab-collector
    restart: unless-stopped
    environment:
      QDB_URL: http://qdb:9090
      DATABASE_URL: ${DATABASE_URL:-postgres://equitylab:equitylab@postgres:5432/equitylab}
      # seed / 热门（K 线回填默认集）；全市场见 ASHARE_UNIVERSE
      COLLECTOR_CODES: ${QDB_FEED_CODES:-600519,000001,300750,601318,000858,002594,600036,601012,688981,510300,830879,835185,000568,600900,601899,300059,002475,600276,000333,601166,600030,002415}
      COLLECTOR_INTERVAL_MS: ${QDB_FEED_MS:-500}
      COLLECTOR_SKIP_ASHARE: ${COLLECTOR_SKIP_ASHARE:-0}
      # full=新浪 hs_a→docs ashare:codes + 分批报价；seed=仅 COLLECTOR_CODES
      ASHARE_UNIVERSE: ${ASHARE_UNIVERSE:-full}
      ASHARE_QUOTE_BATCH: ${ASHARE_QUOTE_BATCH:-80}
      ASHARE_UNIVERSE_REFRESH_SEC: ${ASHARE_UNIVERSE_REFRESH_SEC:-21600}
      # K 线回填：默认 seed；all=全表（极重）；或逗号列表
      ASHARE_KLINE_CODES: ${ASHARE_KLINE_CODES:-}
      # 公开行情回源（仅 collector）；api.binance.com 默认，data-api 作 fallback
      # 国内/部分 Docker Desktop 网络：api.binance.com 常超时，默认走 vision
      BINANCE_REST_URL: ${BINANCE_REST_URL:-https://data-api.binance.vision}
      BINANCE_REST_FALLBACK: ${BINANCE_REST_FALLBACK:-https://api.binance.com}
      BINANCE_WS_URL: ${BINANCE_WS_URL:-wss://data-stream.binance.vision}
      BINANCE_WS_FALLBACK: ${BINANCE_WS_FALLBACK:-wss://stream.binance.com:9443}
      BINANCE_RWA_BASE_URL: ${BINANCE_RWA_BASE_URL:-https://www.binance.com}
      # 仅币安/RWA 使用（markets._upstream_proxies）；勿写成全局 HTTP_PROXY
      COLLECTOR_HTTPS_PROXY: ${COLLECTOR_HTTPS_PROXY:-}
      COLLECTOR_RWA_PROXY: ${COLLECTOR_RWA_PROXY:-}

      # RWA：上游可并行，qdb 写走 write_gate 低优先；默认降并发以免饿死现货
      RWA_WORKERS: ${RWA_WORKERS:-8}
      RWA_CHUNK: ${RWA_CHUNK:-32}
      RWA_KLINE_CHUNK: ${RWA_KLINE_CHUNK:-16}
      RWA_KLINE_WORKERS: ${RWA_KLINE_WORKERS:-4}
      RWA_BOARD_FLUSH_SEC: ${RWA_BOARD_FLUSH_SEC:-1.5}
      RWA_ENGINE_QUOTES_HOT_ONLY: ${RWA_ENGINE_QUOTES_HOT_ONLY:-1}
      QDB_WRITE_FLUSH_MS: ${QDB_WRITE_FLUSH_MS:-25}
      # 过密 REST K 线回填会占住 qdb 引擎锁；可按需加大间隔或只留 1m
      BINANCE_KLINE_INTERVALS: ${BINANCE_KLINE_INTERVALS:-1m,5m,15m,1h,4h,1d}
      BINANCE_KLINE_PAUSE_SEC: ${BINANCE_KLINE_PAUSE_SEC:-1.0}
      BINANCE_KLINE_LIMIT: ${BINANCE_KLINE_LIMIT:-180}
      RWA_KLINE_LIMIT: ${RWA_KLINE_LIMIT:-200}
      BINANCE_KLINE_REFRESH: ${BINANCE_KLINE_REFRESH:-8}
      BINANCE_KLINE_BACKFILL: ${BINANCE_KLINE_BACKFILL:-0}
      BINANCE_KLINE_WRITE_TRADES: ${BINANCE_KLINE_WRITE_TRADES:-0}
      BINANCE_WS_WRITE_TRADES: ${BINANCE_WS_WRITE_TRADES:-1}
      BINANCE_WS_WRITE_QUOTES: ${BINANCE_WS_WRITE_QUOTES:-1}
      BINANCE_WS_QUOTE_FLUSH_MS: ${BINANCE_WS_QUOTE_FLUSH_MS:-50}
      BINANCE_WS_DOC_FLUSH_MS: ${BINANCE_WS_DOC_FLUSH_MS:-200}
    depends_on:
      qdb:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks: [equitylab]

  # 授权回源边车：扫描 market 日线缺口，从新浪补近半年（与盘中 collector 解耦）
  history-ingest:
    build:
      context: .
      dockerfile: services/history-ingest/Dockerfile
    image: equitylab-history-ingest:local
    container_name: equitylab-history-ingest
    restart: unless-stopped
    environment:
      QDB_URL: http://qdb:9090
      DATABASE_URL: ${DATABASE_URL:-postgres://equitylab:equitylab@postgres:5432/equitylab}
      HISTORY_INGEST_WINDOW_DAYS: ${HISTORY_INGEST_WINDOW_DAYS:-180}
      HISTORY_INGEST_MIN_BARS: ${HISTORY_INGEST_MIN_BARS:-100}
      HISTORY_INGEST_DATALEN: ${HISTORY_INGEST_DATALEN:-200}
      HISTORY_INGEST_SLEEP_MS: ${HISTORY_INGEST_SLEEP_MS:-400}
      HISTORY_INGEST_IDLE_SEC: ${HISTORY_INGEST_IDLE_SEC:-30}
      HISTORY_INGEST_BATCH: ${HISTORY_INGEST_BATCH:-50}
      HISTORY_INGEST_MAX_PER_ROUND: ${HISTORY_INGEST_MAX_PER_ROUND:-200}
      HISTORY_INGEST_FAIL_TTL_SEC: ${HISTORY_INGEST_FAIL_TTL_SEC:-1800}
      HISTORY_INGEST_SKIP: ${HISTORY_INGEST_SKIP:-0}
    depends_on:
      qdb:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks: [equitylab]

  # --- 应用服务 ---
  # 行情：Provider + Redis 短缓存；也可经网关 /api/market/* 访问
  market-data:
    build:
      context: .
      dockerfile: services/market-data/Dockerfile
    image: equitylab-market-data:local
    container_name: equitylab-market-data
    restart: unless-stopped
    environment:
      PORT: "3002"
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      DATABASE_URL: ${DATABASE_URL:-postgres://equitylab:equitylab@postgres:5432/equitylab}
      MARKET_PROVIDER: ${MARKET_PROVIDER:-mock}
      ALPHAFEED_API_KEY: ${ALPHAFEED_API_KEY:-}
      ALPHAFEED_BASE_URL: ${ALPHAFEED_BASE_URL:-https://api.alphafeed.org/v1}
      BINANCE_REST_URL: ${BINANCE_REST_URL:-https://api.binance.com}
      BINANCE_REST_FALLBACK: ${BINANCE_REST_FALLBACK:-https://data-api.binance.vision}
      BINANCE_WS_URL: ${BINANCE_WS_URL:-wss://data-stream.binance.vision}
      BINANCE_RWA_BASE_URL: ${BINANCE_RWA_BASE_URL:-https://www.binance.com}
      QDB_URL: ${QDB_URL:-http://qdb:9090}
    ports:
      - "${MARKET_DATA_PORT:-3002}:3002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdb:
        condition: service_healthy
    networks: [equitylab]

  # Python 研究层：RAG / 因子 / 回测（内部 8002，经网关 /api/research/*）
  research:
    build:
      context: .
      dockerfile: apps/research/Dockerfile
    image: equitylab-research:local
    container_name: equitylab-research
    restart: unless-stopped
    environment:
      PORT: "8002"
      DATABASE_URL: ${DATABASE_URL:-postgres://equitylab:equitylab@postgres:5432/equitylab}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      QDRANT_URL: http://qdrant:6333
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      MARKET_DATA_URL: http://market-data:3002
      QDB_URL: ${QDB_URL:-http://qdb:9090}
    depends_on:
      qdb:
        condition: service_healthy
      qdrant:
        condition: service_started
      market-data:
        condition: service_started
    networks: [equitylab]

  # TS 编排层：Agent 路由与工具调用（内部 8001；聊天走网关 /api/chat）
  orchestrator:
    build:
      context: ./apps/orchestrator
      dockerfile: Dockerfile
    image: equitylab-orchestrator:local
    container_name: equitylab-orchestrator
    restart: unless-stopped
    environment:
      PORT: "8001"
      RESEARCH_URL: http://research:8002
      MARKET_DATA_URL: http://market-data:3002
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEFAULT_CHAT_MODEL: ${DEFAULT_CHAT_MODEL:-deepseek-chat}
    depends_on:
      - research
      - market-data
    networks: [equitylab]

  # Rust 网关：统一入口、限流、反代（宿主机默认 3000）
  gateway:
    build:
      context: ./services/gateway
      dockerfile: Dockerfile
    image: equitylab-gateway:local
    container_name: equitylab-gateway
    restart: unless-stopped
    environment:
      PORT: "3000"
      ORCHESTRATOR_URL: http://orchestrator:8001
      RESEARCH_URL: http://research:8002
      MARKET_DATA_URL: http://market-data:3002
      RATE_LIMIT_PER_MINUTE: "120"
    ports:
      - "${GATEWAY_PORT:-3000}:3000"
    depends_on:
      - orchestrator
      - market-data
    networks: [equitylab]

  # Next.js 前端：浏览器走同源 /api/chat；容器内 BFF 经 Docker DNS 访问网关
  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    image: equitylab-frontend:local
    container_name: equitylab-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_GATEWAY_URL: http://localhost:${GATEWAY_PORT:-3000}
      GATEWAY_URL: http://gateway:3000
      # Next standalone 默认绑容器 hostname，探活需显式 0.0.0.0
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
    ports:
      - "${FRONTEND_PORT:-3001}:3000"
    depends_on:
      - gateway
    networks: [equitylab]

  # --- 可观测性：JSON 日志 → Alloy → Loki → Grafana ---
  loki:
    image: grafana/loki:3.4.2
    container_name: equitylab-loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./infra/observability/loki-config.yaml:/etc/loki/config.yaml:ro
      - equitylab_loki:/loki
    ports:
      - "${LOKI_PORT:-3100}:3100"
    networks: [equitylab]

  alloy:
    image: grafana/alloy:v1.8.1
    container_name: equitylab-alloy
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./infra/observability/alloy-config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - equitylab_alloy:/var/lib/alloy/data
    depends_on:
      - loki
    networks: [equitylab]

  grafana:
    image: grafana/grafana:11.6.0
    container_name: equitylab-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: dark
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - equitylab_grafana:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3003}:3000"
    depends_on:
      - loki
    networks: [equitylab]

networks:
  equitylab:
    name: equitylab-net

volumes:
  equitylab_pgdata:
    name: equitylab-pgdata
  equitylab_qdrant:
    name: equitylab-qdrant
  equitylab_qdb:
    name: equitylab-qdbdata
  equitylab_loki:
    name: equitylab-loki
  equitylab_alloy:
    name: equitylab-alloy
  equitylab_grafana:
    name: equitylab-grafana
