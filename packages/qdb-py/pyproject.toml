[project]
name = "equitylab-qdb"
version = "0.1.0"
description = "EquityLab qdb HTTP client (read + write)"
requires-python = ">=3.11"
dependencies = ["requests>=2.31"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
