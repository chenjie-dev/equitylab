[project]
name = "equitylab-market"
version = "0.1.0"
description = "EquityLab Postgres market schema writer + sina helpers (collector family)"
requires-python = ">=3.11"
dependencies = [
    "psycopg2-binary>=2.9",
    "requests>=2.31",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
